name: Publish SubHD test image

on:
  workflow_dispatch:
  push:
    branches: [feature/subhd-provider]
    paths:
      - bazarr/**
      - custom_libs/**
      - frontend/**
      - libs/**
      - migrations/**
      - bazarr.py
      - requirements.txt
      - dev-setup/Dockerfile.subhd*
      - .github/workflows/publish_subhd_image.yaml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'pierredeman/bazarr'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dev-setup/Dockerfile.subhd
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/pierredeman/bazarr-subhd2:subhd2
            ghcr.io/pierredeman/bazarr-subhd2:sha-${{ github.sha }}
